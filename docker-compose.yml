services:
  # =========================================================================
  # 1. PostgreSQL Database Layer
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: reqwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reqwise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reqwise"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reqwise-net

  # =========================================================================
  # 2. Java 21+ Spring Boot 3.4+ Backend API
  # =========================================================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: reqwise-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reqwise
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      REQWISE_STORAGE_BASE_DIR: /storage_data
      REQWISE_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost"
    ports:
      - "8088:8080"
    volumes:
      - ./storage_data:/storage_data
    networks:
      - reqwise-net

  # =========================================================================
  # 3. React 18 / Vite Frontend SPA & Nginx Reverse Proxy
  # =========================================================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: reqwise-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"
    networks:
      - reqwise-net

# =========================================================================
# Volumes & Networks
# =========================================================================
volumes:
  postgres_data:
    driver: local

networks:
  reqwise-net:
    driver: bridge
