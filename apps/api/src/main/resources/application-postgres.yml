spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reqwise
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

reqwise:
  storage:
    base-dir: "storage_data"
