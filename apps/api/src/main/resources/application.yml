server:
  port: 8080

spring:
  application:
    name: reqwise-api
  profiles:
    active: dev
  jpa:
    open-in-view: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

reqwise:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:3000"
  storage:
    base-dir: "storage_data"
